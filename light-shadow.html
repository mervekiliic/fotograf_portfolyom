<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light&Shadow | Merve Kılıç</title>
    <style>
      /* 1. SAYFA GENELİ */
      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: "Arial", sans-serif;
        margin: 0;
        padding: clamp(15px, 5vw, 40px);
        overflow-x: hidden;
      }

      /* 1.5 BAŞLIK RESPONSİF STİL */
      h1 {
        font-size: clamp(1.5rem, 8vw, 3.5rem);
        letter-spacing: clamp(2px, 2vw, 10px);
        margin: 0 0 clamp(20px, 5vw, 50px) 0;
        word-wrap: break-word;
        overflow-wrap: break-word;
        hyphens: auto;
        font-weight: 300;
      }

      /* 2. GERİ DÖN BUTONU */
      .back-button {
        display: inline-block;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.6);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        padding: 5px 0;
        font-size: clamp(14px, 3vw, 20px);
        letter-spacing: clamp(1px, 1.5vw, 3px);
        text-transform: uppercase;
        margin-bottom: clamp(30px, 8vw, 60px);
        transition: all 0.4s ease;
      }

      .back-button:hover {
        color: #fff;
        border-bottom: 1px solid #fff;
        padding-left: 10px;
      }

      .gallery {
        column-count: 3;
        column-gap: clamp(10px, 3vw, 20px);
        padding-bottom: clamp(30px, 5vw, 50px);
      }

      /* 2. Resimlerin kutusunu sabitle */
      .gallery-item {
        display: inline-block;
        width: 100%;
        margin-bottom: clamp(15px, 3vw, 20px);
        opacity: 0;
        transform: translateY(30px);
        animation: slideUp 0.8s ease-out forwards;
        backface-visibility: hidden;
        -webkit-column-break-inside: avoid;
        break-inside: avoid;
      }

      /* 3. Hover efektini sadeleştir ve zorla */
      .gallery-item img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
        transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        transform: translateZ(0);
        will-change: transform;
      }

      .gallery-item:hover img {
        transform: scale(1.02) translateZ(0);
        opacity: 1 !important;
      }

      @keyframes slideUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 4. SIRALI GİRİŞ ANİMASYONU (Delay) */
      .gallery-item:nth-child(1) {
        animation-delay: 0.1s;
      }
      .gallery-item:nth-child(2) {
        animation-delay: 0.2s;
      }
      .gallery-item:nth-child(3) {
        animation-delay: 0.3s;
      }
      .gallery-item:nth-child(4) {
        animation-delay: 0.4s;
      }
      .gallery-item:nth-child(5) {
        animation-delay: 0.5s;
      }

      /* RESPONSIVE BREAKPOINT'LER */
      /* Tablet & Desktop Orta (900px+) */
      @media (max-width: 1024px) {
        .gallery {
          column-count: 2;
        }
      }

      /* Tablet (768px - 1024px) */
      @media (max-width: 768px) {
        .gallery {
          column-count: 2;
        }
      }

      /* Telefon Orta (480px - 600px) */
      @media (max-width: 600px) {
        .gallery {
          column-count: 1;
          column-gap: 0;
        }
      }

      /* Telefon Küçük (<480px) */
      @media (max-width: 480px) {
        body {
          padding: clamp(10px, 3vw, 15px);
        }
      }

      /* Dil Butonları Sağ Üst Sabit Konum */
      .lang-switcher {
        position: fixed;
        right: clamp(15px, 4vw, 40px);
        top: clamp(15px, 3vw, 35px);
        display: flex;
        gap: clamp(8px, 2vw, 12px);
        font-size: clamp(8px, 2vw, 11px);
        letter-spacing: clamp(1px, 1vw, 2px);
        z-index: 9999;
      }

      .lang-switcher span {
        cursor: pointer;
        opacity: 0.4;
        color: white;
        transition: all 0.3s ease;
      }

      .lang-switcher span.active,
      .lang-switcher span:hover {
        opacity: 1;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      .lang-switcher span.active {
        border-bottom: 1px solid white;
      }

      /* Geri Butonu ve Morluk Engelleme */
      #back-to-portfolio,
      .back-button,
      .back-button:visited {
        color: rgba(255, 255, 255, 0.6) !important;
        text-decoration: none;
        transition: all 0.4s ease;
        display: inline-block;
      }

      #back-to-portfolio:hover {
        color: #fff !important;
        padding-left: 10px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      }

      /* CATEGORY NAVIGATION */
      .category-navigation {
        margin-top: clamp(50px, 10vw, 100px);
        border-top: 1px solid #222;
        padding-top: clamp(30px, 5vw, 50px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
      }

      .nav-cat-block {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 140px;
      }

      .nav-cat-block.prev {
        text-align: left;
      }

      .nav-cat-block.next {
        text-align: right;
      }

      .nav-cat-label {
        font-size: clamp(12px, 2.5vw, 16px);
        letter-spacing: clamp(1px, 1vw, 2px);
        color: #555;
        margin-bottom: 8px;
        margin-top: 0;
      }

      .nav-cat-link {
        color: #fff;
        text-decoration: none;
        font-size: clamp(1rem, 4vw, 1.8rem);
        letter-spacing: clamp(1px, 1.5vw, 3px);
        text-transform: uppercase;
        transition: all 0.3s ease;
        display: inline-block;
      }

      .nav-cat-link:hover {
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      /* LIGHTBOX MODAL STYLES */
      .gallery-item img {
        cursor: pointer;
      }

      .lightbox-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        z-index: 99999;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        padding: clamp(20px, 4vw, 40px);
      }

      .lightbox-modal.active {
        display: flex;
        opacity: 1;
      }

      .lightbox-content {
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        transform: scale(0.92);
        transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      }

      .lightbox-modal.active .lightbox-content {
        transform: scale(1);
      }

      .lightbox-close {
        position: absolute;
        top: clamp(20px, 4vw, 35px);
        right: clamp(20px, 4vw, 40px);
        color: rgba(255, 255, 255, 0.75);
        font-size: clamp(32px, 5vw, 48px);
        font-weight: 300;
        cursor: pointer;
        line-height: 1;
        transition: all 0.2s ease;
        user-select: none;
        z-index: 100000;
      }

      .lightbox-close:hover {
        color: #ffffff;
        transform: scale(1.15);
      }

      .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.85);
        font-size: clamp(20px, 3vw, 30px);
        width: clamp(40px, 5vw, 56px);
        height: clamp(40px, 5vw, 56px);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        user-select: none;
        z-index: 100000;
      }

      .lightbox-nav:hover {
        background: rgba(255, 255, 255, 0.25);
        color: #ffffff;
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-50%) scale(1.1);
      }

      .lightbox-prev {
        left: clamp(15px, 3vw, 40px);
      }

      .lightbox-next {
        right: clamp(15px, 3vw, 40px);
      }
    </style>
  </head>
  <body>
    <div class="lang-switcher">
      <span onclick="setLanguage('tr')" id="lang-tr">TR</span>
      <span class="separator">|</span>
      <span onclick="setLanguage('en')" id="lang-en">EN</span>
    </div>

    <a href="index.html" class="lang-key back-button" id="back-to-portfolio"
      >← PORTFOLIO</a
    >

    <h1 class="lang-key" id="light-page-title">LIGHT&SHADOW</h1>

    <div class="gallery">
      <div class="gallery-item">
        <img src="photoisik1.webp" alt="1" loading="lazy" decoding="async" />
      </div>
      <div class="gallery-item">
        <img src="lightshadownew.webp" alt="3" loading="lazy" decoding="async" />
      </div>
      <div class="gallery-item">
        <img src="maylight.webp" alt="maylight" loading="lazy" decoding="async" />
      </div>
      <div class="gallery-item">
        <img src="photoisik2.webp" alt="2" loading="lazy" decoding="async" />
      </div>
    </div>

    <div class="category-navigation">
      <div class="nav-cat-block prev">
        <p class="lang-key nav-cat-label" id="prev-cat-label">PREVIOUS CATEGORY</p>
        <a href="nature.html" class="lang-key nav-cat-link" id="prev-cat-nature">← NATURE</a>
      </div>
      <div class="nav-cat-block next">
        <p class="lang-key nav-cat-label" id="next-cat-label">NEXT CATEGORY</p>
        <a href="street.html" class="lang-key nav-cat-link" id="next-cat-street-link">STREET →</a>
      </div>
    </div>

    <!-- LIGHTBOX MODAL -->
    <div id="lightbox-modal" class="lightbox-modal" aria-hidden="true">
      <span class="lightbox-close" id="lightbox-close">&times;</span>
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&#10094;</button>
      <img id="lightbox-img" class="lightbox-content" src="" alt="Detailed view" />
      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&#10095;</button>
    </div>

    <script>
      const translations = {
        en: {
          "back-to-portfolio": "← PORTFOLIO",
          "light-page-title": "LIGHT&SHADOW",
          "prev-cat-label": "PREVIOUS CATEGORY",
          "next-cat-label": "NEXT CATEGORY",
          "prev-cat-nature": "← NATURE",
          "next-cat-street-link": "STREET →",
        },
        tr: {
          "back-to-portfolio": "← PORTFOLYO",
          "light-page-title": "IŞIK&GÖLGE",
          "prev-cat-label": "ÖNCEKİ KATEGORİ",
          "next-cat-label": "SIRADAKİ KATEGORİ",
          "prev-cat-nature": "← DOĞA",
          "next-cat-street-link": "SOKAK →",
        },
      };

      function setLanguage(lang) {
        const elements = document.querySelectorAll(".lang-key");
        elements.forEach((el) => {
          const id = el.getAttribute("id");
          if (translations[lang] && translations[lang][id]) {
            el.textContent = translations[lang][id];
          }
        });

        const btnTr = document.getElementById("lang-tr");
        const btnEn = document.getElementById("lang-en");
        if (btnTr && btnEn) {
          btnTr.classList.remove("active");
          btnEn.classList.remove("active");
          const activeBtn = document.getElementById("lang-" + lang);
          if (activeBtn) activeBtn.classList.add("active");
        }
        localStorage.setItem("selectedLang", lang);
      }

      function initLightbox() {
        const modal = document.getElementById("lightbox-modal");
        const modalImg = document.getElementById("lightbox-img");
        const closeBtn = document.getElementById("lightbox-close");
        const prevBtn = document.getElementById("lightbox-prev");
        const nextBtn = document.getElementById("lightbox-next");

        if (!modal || !modalImg || !closeBtn) return;

        let visibleImgs = [];
        let currentIndex = -1;

        const updateVisibleImages = () => {
          const allImgs = Array.from(document.querySelectorAll(".gallery-item img"));
          visibleImgs = allImgs.filter((img) => {
            const item = img.closest(".gallery-item");
            return item && getComputedStyle(item).display !== "none";
          });
        };

        const showImageAtIndex = (index) => {
          if (visibleImgs.length === 0) return;
          currentIndex = (index + visibleImgs.length) % visibleImgs.length;
          const targetImg = visibleImgs[currentIndex];
          modalImg.src = targetImg.src;
          modalImg.alt = targetImg.alt || "Photo view";
        };

        document.addEventListener("click", (e) => {
          const clickedImg = e.target.closest(".gallery-item img");
          if (clickedImg) {
            updateVisibleImages();
            const index = visibleImgs.indexOf(clickedImg);
            if (index !== -1) {
              currentIndex = index;
              showImageAtIndex(currentIndex);
              modal.classList.add("active");
              modal.setAttribute("aria-hidden", "false");
              document.body.style.overflow = "hidden";
            }
          }
        });

        const closeModal = () => {
          modal.classList.remove("active");
          modal.setAttribute("aria-hidden", "true");
          document.body.style.overflow = "";
        };

        const showPrev = (e) => {
          if (e) e.stopPropagation();
          showImageAtIndex(currentIndex - 1);
        };

        const showNext = (e) => {
          if (e) e.stopPropagation();
          showImageAtIndex(currentIndex + 1);
        };

        if (prevBtn) prevBtn.addEventListener("click", showPrev);
        if (nextBtn) nextBtn.addEventListener("click", showNext);
        closeBtn.addEventListener("click", closeModal);

        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });

        document.addEventListener("keydown", (e) => {
          if (!modal.classList.contains("active")) return;
          if (e.key === "Escape") closeModal();
          if (e.key === "ArrowLeft") showPrev();
          if (e.key === "ArrowRight") showNext();
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const savedLang = localStorage.getItem("selectedLang") || "en";
        setLanguage(savedLang);
        initLightbox();
      });
    </script>
  </body>
</html>
